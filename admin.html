<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Dashboard — Eshonguzar M34</title>
<style>
  :root{
    --bg:#F4F6F8;
    --surface:#FFFFFF;
    --ink:#1C2420;
    --ink-soft:#5A6A64;
    --teal:#1F4B49;
    --teal-light:#2F6B66;
    --teal-wash:#EAF2F0;
    --amber:#D9A441;
    --amber-dark:#B9832B;
    --amber-wash:#FDF8EC;
    --green:#2E7D32;
    --green-wash:#E8F5E9;
    --brick:#C62828;
    --brick-wash:#FFEBEE;
    --line:#E0E6E4;
    --radius:12px;
    --shadow: 0 4px 12px rgba(0,0,0,0.05);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Segoe UI', Roboto, -apple-system, sans-serif;
    background:var(--bg); color:var(--ink); min-height:100vh;
  }

  /* Login */
  #loginScreen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .login-card{
    background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow);
    border:1px solid var(--line); padding:32px 24px; width:100%; max-width:360px; text-align:center;
  }
  .login-card h2{ color:var(--teal); font-size:22px; margin-bottom:6px; }
  .login-card p{ color:var(--ink-soft); font-size:13px; margin-bottom:20px; }
  .login-card input{
    width:100%; padding:12px; border-radius:8px; border:1px solid var(--line);
    font-size:16px; text-align:center; margin-bottom:14px; outline:none;
  }
  .login-card button{
    width:100%; padding:12px; border:none; border-radius:8px; background:var(--teal);
    color:#fff; font-weight:700; font-size:15px; cursor:pointer; transition:0.2s;
  }
  .login-card button:hover{ background:var(--teal-light); }
  .login-err{ color:var(--brick); font-size:13px; margin-top:12px; display:none; }

  /* App Shell */
  #app{ display:none; min-height:100vh; }
  header{
    background:var(--teal); color:#fff; padding:14px 20px;
    display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:100; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  header h1{ font-size:18px; font-weight:700; }
  header .sub{ font-size:11px; opacity:0.8; }
  #logoutBtn{
    background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.3); color:#fff;
    padding:6px 14px; border-radius:6px; font-size:12px; cursor:pointer; font-weight:600;
  }

  nav.tabbar{
    display:flex; gap:6px; background:var(--surface); border-bottom:1px solid var(--line);
    padding:8px 16px; overflow-x:auto; position:sticky; top:58px; z-index:99;
  }
  nav.tabbar button{
    padding:10px 16px; border:none; background:transparent; border-radius:8px;
    font-size:13px; font-weight:600; color:var(--ink-soft); cursor:pointer; white-space:nowrap;
  }
  nav.tabbar button.active{ background:var(--teal-wash); color:var(--teal); }

  main{ max-width:960px; margin:0 auto; padding:20px 16px; }
  .panel{ display:none; }
  .panel.active{ display:block; }
  .empty{ text-align:center; color:var(--ink-soft); font-size:14px; padding:40px 10px; }

  .toolbar{ display:flex; gap:10px; margin-bottom:16px; align-items:center; flex-wrap:wrap; }
  .toolbar input, .toolbar select{
    padding:10px 14px; border-radius:8px; border:1px solid var(--line); font-size:13.5px; outline:none; background:#fff;
  }
  .toolbar input[type=text]{ flex:1; min-width:200px; }
  .toolbar button{
    padding:10px 16px; border-radius:8px; border:1px solid var(--line); background:var(--surface);
    font-size:13px; font-weight:600; cursor:pointer; color:var(--teal); white-space:nowrap;
  }
  .btn-primary{ background:var(--teal) !important; color:#fff !important; border:none !important; }

  /* Dashboard Cards */
  .stats-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:12px; margin-bottom:20px; }
  .stat-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; box-shadow:var(--shadow);
  }
  .stat-card .label{ font-size:12px; color:var(--ink-soft); margin-bottom:6px; }
  .stat-card .value{ font-size:20px; font-weight:800; color:var(--teal); }
  .stat-card.amber .value{ color:var(--amber-dark); }
  .stat-card.brick .value{ color:var(--brick); }

  .section-title{ font-size:15px; font-weight:700; margin:24px 0 12px; color:var(--ink); }
  .rank-list{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
  .rank-row{ display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); font-size:13px; }
  .rank-row:last-child{ border-bottom:none; }
  .rank-num{ width:24px; height:24px; border-radius:50%; background:var(--teal-wash); color:var(--teal); font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .rank-name{ flex:1; font-weight:600; }
  .rank-qty{ font-weight:700; color:var(--ink-soft); font-size:12.5px; }

  /* Orders */
  .order-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:16px; margin-bottom:14px;
  }
  .order-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
  .order-top .cust{ font-weight:700; font-size:15px; }
  .order-top .time{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .status-badge{ font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; }
  .status-yangi{ background:var(--amber-wash); color:var(--amber-dark); }
  .status-jarayonda{ background:var(--teal-wash); color:var(--teal); }
  .status-yetkazildi{ background:var(--green-wash); color:var(--green); }
  .status-bekor{ background:var(--brick-wash); color:var(--brick); }
  
  .order-info{ font-size:13px; color:var(--ink-soft); margin-bottom:10px; line-height:1.5; }
  .order-items{ border-top:1px dashed var(--line); border-bottom:1px dashed var(--line); padding:10px 0; margin-bottom:10px; }
  .order-items div{ font-size:13px; display:flex; justify-content:space-between; padding:3px 0; }
  .order-total{ font-weight:800; font-size:15px; text-align:right; margin-bottom:12px; color:var(--teal); }
  
  .status-row{ display:flex; gap:6px; flex-wrap:wrap; }
  .status-row button{
    flex:1; min-width:80px; padding:8px; border-radius:6px; border:1px solid var(--line);
    background:#fff; font-size:12px; font-weight:600; cursor:pointer; color:var(--ink-soft);
  }
  .status-row button.current{ border-color:var(--teal); color:var(--teal); background:var(--teal-wash); }

  /* Products */
  .prod-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:14px 16px; margin-bottom:12px;
  }
  .prod-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .prod-name{ font-weight:700; font-size:14px; }
  .prod-cat{ font-size:11.5px; color:var(--ink-soft); }
  .prod-fields{ display:grid; grid-template-columns:repeat(auto-fit, minmax(100px, 1fr)); gap:10px; }
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field label{ font-size:11px; color:var(--ink-soft); font-weight:600; }
  .field input{ padding:8px 10px; border-radius:6px; border:1px solid var(--line); font-size:13px; width:100%; outline:none; }
  
  .prod-actions{ display:flex; gap:8px; margin-top:12px; }
  .prod-save{ flex:1; padding:9px; border:none; border-radius:6px; background:var(--teal); color:#fff; font-weight:700; font-size:12.5px; cursor:pointer; }
  .prod-del{ padding:9px 14px; border:none; border-radius:6px; background:var(--brick-wash); color:var(--brick); font-weight:700; font-size:12.5px; cursor:pointer; }

  /* Broadcast */
  .broadcast-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:20px;
  }
  .broadcast-card input, .broadcast-card textarea{
    width:100%; padding:12px; border-radius:8px; border:1px solid var(--line);
    font-size:13.5px; font-family:inherit; margin-bottom:12px; outline:none;
  }
  .broadcast-card textarea{ min-height:120px; resize:vertical; }
  .broadcast-send{
    width:100%; padding:12px; border:none; border-radius:8px; background:var(--amber);
    color:var(--teal); font-weight:800; font-size:14px; cursor:pointer;
  }
  
  /* Modal */
  .modal-bg{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:200; align-items:center; justify-content:center; padding:16px; }
  .modal{ background:#fff; border-radius:var(--radius); padding:20px; width:100%; max-width:420px; box-shadow:var(--shadow); }
  .modal h3{ margin-bottom:14px; color:var(--teal); font-size:16px; }
  .modal input, .modal select{ width:100%; padding:10px; border-radius:6px; border:1px solid var(--line); margin-bottom:10px; font-size:13px; outline:none; }
  .modal-btns{ display:flex; gap:8px; margin-top:10px; }
  .modal-btns button{ flex:1; padding:10px; border-radius:6px; border:none; font-weight:700; cursor:pointer; font-size:13px; }
</style>
</head>

<!-- LOGIN SCREEN -->

  </main>
</div>

function tryLogin(){
  if(document.getElementById('passInput').value === ADMIN_PASSWORD){
    sessionStorage.setItem('admin_ok', '1');
    showApp();
  } else { document.getElementById('loginErr').style.display = 'block'; }
}
function logout(){
  sessionStorage.removeItem('admin_ok');
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
}
function showApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadDashboard(); loadOrders(); loadProducts(); loadSubsCount();
}
document.getElementById('passInput').addEventListener('keydown', e=>{ if(e.key === 'Enter') tryLogin(); });
if(sessionStorage.getItem('admin_ok') === '1'){ showApp(); }

function switchTab(name){
  document.querySelectorAll('nav.tabbar button').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active', p.id==='panel-'+name));
}

function formatSom(n){ return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " so'm"; }
function timeAgo(ts){ return ts ? new Date(ts).toLocaleString('uz-UZ') : ''; }
function catName(catId){ const c = CATEGORIES.find(c=>c.id===catId); return c ? c.name : catId; }

/* Dashboard */
async function loadDashboard(){
  const wrap = document.getElementById('dashboardContent');
  wrap.innerHTML = '<div class="empty">Yuklanmoqda…</div>';
  try{
    const [oRes, sRes] = await Promise.all([
      fetch(STOCK_SYNC_URL + "/orders.json"),
      fetch(STOCK_SYNC_URL + "/stock.json")
    ]);
    renderDashboard((await oRes.json())||{}, (await sRes.json())||{});
  } catch(e){ wrap.innerHTML = '<div class="empty">Xatolik yuz berdi.</div>'; }
}

  document.getElementById('dashboardContent').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="label">Bugungi tushum</div><div class="value">${formatSom(todayRevenue)}</div></div>
      <div class="stat-card amber"><div class="label">Bugungi buyurtmalar</div><div class="value">${todayOrders.length}</div></div>
      <div class="stat-card"><div class="label">Jami buyurtmalar</div><div class="value">${list.filter(o=>o.status!=='bekor').length}</div></div>
      <div class="stat-card brick"><div class="label">Kutilayotgan</div><div class="value">${list.filter(o=>o.status==='yangi'||!o.status).length}</div></div>
    </div>
    <div class="section-title">Eng ko'p sotilgan mahsulotlar</div>
    <div class="rank-list">
      ${topProducts.length ? topProducts.map(([name,qty],i)=>`
        <div class="rank-row"><span class="rank-num">${i+1}</span><span class="rank-name">${name}</span><span class="rank-qty">${qty} dona</span></div>
      `).join('') : '<div class="empty">Ma\'lumotlar mavjud emas</div>'}
    </div>
  `;
}

/* Orders */
let ordersCache = {};
async function loadOrders(){
  try{
    ordersCache = (await (await fetch(STOCK_SYNC_URL + "/orders.json")).json()) || {};
    renderOrders();
  } catch(e){}
}
function renderOrders(){
  const wrap = document.getElementById('ordersList');
  const search = (document.getElementById('orderSearch').value || '').toLowerCase();
  const statusFilter = document.getElementById('orderStatusFilter').value;
  
  let keys = Object.keys(ordersCache).reverse();
  keys = keys.filter(k=>{
    const o = ordersCache[k];
    const st = o.status || 'yangi';
    const matchSearch = !search || (o.customer?.name||'').toLowerCase().includes(search) || (o.customer?.phone||'').includes(search);
    const matchStatus = statusFilter === 'all' || st === statusFilter;
    return matchSearch && matchStatus;
  });

  if(!keys.length){ wrap.innerHTML = '<div class="empty">Buyurtmalar topilmadi.</div>'; return; }

  wrap.innerHTML = keys.map(key=>{
    const o = ordersCache[key];
    const st = o.status || 'yangi';
    return `
      <div class="order-card">
        <div class="order-top">
          <div><div class="cust">${o.customer?.name||"Noma'lum"}</div><div class="time">${timeAgo(o.createdAt)}</div></div>
          <span class="status-badge status-${st}">${STATUS_LABELS[st]||st}</span>
        </div>
        <div class="order-info">
          📞 <b>${o.customer?.phone||'—'}</b> | 📍 ${o.customer?.address||'Manzil ko\'rsatilmadi'}
        </div>
        <div class="order-items">
          ${(o.items||[]).map(i=>`<div><span>${i.name} x ${i.qty}</span><span>${formatSom(i.price*i.qty)}</span></div>`).join('')}
        </div>
        <div class="order-total">Jami: ${formatSom(o.total||0)}</div>
        <div class="status-row">
          ${Object.keys(STATUS_LABELS).map(s=>`
            <button class="${s===st?'current':''}" onclick="setOrderStatus('${key}','${s}')">${STATUS_LABELS[s]}</button>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');
}
async function setOrderStatus(key, status){
  await fetch(`${STOCK_SYNC_URL}/orders/${key}/status.json`, { method: "PUT", body: JSON.stringify(status) });
  ordersCache[key].status = status;
  renderOrders();
}

/* Products */
let stockCache = {}, overridesCache = {};
async function loadProducts(){
  try{
    const [sRes, oRes, cRes] = await Promise.all([
      fetch(STOCK_SYNC_URL + "/stock.json"),
      fetch(STOCK_SYNC_URL + "/overrides.json"),
      fetch(STOCK_SYNC_URL + "/custom_products.json")
    ]);
    stockCache = (await sRes.json()) || {};
    overridesCache = (await oRes.json()) || {};
    customProducts = Object.values((await cRes.json()) || {});
    renderProducts();
  } catch(e){}
}

function getAllProducts(){
  return [...INITIAL_PRODUCTS, ...customProducts];
}

function renderProducts(){
  const wrap = document.getElementById('productsList');
  const q = (document.getElementById('prodSearch').value || '').toLowerCase().trim();
  const list = getAllProducts().filter(p=>!q || p.name.toLowerCase().includes(q));

  if(!list.length){ wrap.innerHTML = '<div class="empty">Mahsulotlar topilmadi.</div>'; return; }

  wrap.innerHTML = list.map(p=>{
    const stock = stockCache[p.id] ?? p.stock;
    const ov = overridesCache[p.id] || {};
    const price = ov.price ?? p.price;
    const discount = ov.discount ?? 0;
    return `
      <div class="prod-card">
        <div class="prod-top">
          <div><div class="prod-name">${p.name}</div><div class="prod-cat">${catName(p.cat)} · ID: ${p.id}</div></div>
        </div>
        <div class="prod-fields">
          <div class="field"><label>Narx (so'm)</label><input type="number" id="price-${p.id}" value="${price}"></div>
          <div class="field"><label>Chegirma (%)</label><input type="number" id="discount-${p.id}" value="${discount}"></div>
          <div class="field"><label>Zaxira (dona)</label><input type="number" id="stock-${p.id}" value="${stock}"></div>
        </div>
        <div class="prod-actions">
          <button class="prod-save" onclick="saveProduct(${p.id})">Saqlash</button>
          <button class="prod-del" onclick="deleteProduct(${p.id})">O'chirish</button>
        </div>
      </div>
    `;
  }).join('');
}

async function saveProduct(id){
  const price = parseInt(document.getElementById('price-'+id).value) || 0;
  const discount = parseInt(document.getElementById('discount-'+id).value) || 0;
  const stock = parseInt(document.getElementById('stock-'+id).value) || 0;

  await Promise.all([
    fetch(`${STOCK_SYNC_URL}/stock/${id}.json`, { method: "PUT", body: JSON.stringify(stock) }),
    fetch(`${STOCK_SYNC_URL}/overrides/${id}.json`, { method: "PUT", body: JSON.stringify({price, discount}) })
  ]);
  alert("Saqlandi!");
}

async function deleteProduct(id){
  if(!confirm("Haqiqatan ham ushbu mahsulotni o'chirmoqchimisiz?")) return;
  await fetch(`${STOCK_SYNC_URL}/custom_products/${id}.json`, { method: "DELETE" });
  customProducts = customProducts.filter(p => p.id !== id);
  renderProducts();
}

function openAddProductModal(){
  const select = document.getElementById('newProdCat');
  select.innerHTML = CATEGORIES.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
  document.getElementById('addProductModal').style.display = 'flex';
}
function closeAddProductModal(){ document.getElementById('addProductModal').style.display = 'none'; }

async function saveNewProduct(){
  const name = document.getElementById('newProdName').value.trim();
  const cat = document.getElementById('newProdCat').value;
  const price = parseInt(document.getElementById('newProdPrice').value) || 0;
  const stock = parseInt(document.getElementById('newProdStock').value) || 0;

  if(!name || !price) return alert("Barcha maydonlarni to'ldiring");

  const id = Date.now();
  const newProd = { id, name, cat, price, stock };

  await fetch(`${STOCK_SYNC_URL}/custom_products/${id}.json`, { method: "PUT", body: JSON.stringify(newProd) });
  customProducts.push(newProd);
  closeAddProductModal();
  renderProducts();
}

/* Broadcast */
let usersCache = {};
async function loadSubsCount(){
  try{
    usersCache = (await (await fetch(STOCK_SYNC_URL + "/users.json")).json()) || {};
    document.getElementById('subsCount').textContent = Object.keys(usersCache).length;
  } catch(e){}
}

async function sendBroadcast(){
  const text = document.getElementById('broadcastText').value.trim();
  const photo = document.getElementById('broadcastImg').value.trim();
  const btnText = document.getElementById('broadcastBtnText').value.trim();
  const btnUrl = document.getElementById('broadcastBtnUrl').value.trim();
  
  if(!text) return alert("Xabar matnini kiriting!");
  
  const ids = Object.keys(usersCache);
  if(!ids.length) return alert("Mijozlar ro'yxati bo'sh.");
  if(!confirm(`Xabar ${ids.length} ta mijozga yuboriladi. Tasdiqlaysizmi?`)) return;

  const btn = document.getElementById('broadcastBtn');
  btn.disabled = true; btn.textContent = "Yuborilmoqda...";

  let sent = 0;
  for(const id of ids){
    try{
      const payload = { chat_id: id };
      let endpoint = 'sendMessage';

      if(photo){
        endpoint = 'sendPhoto';
        payload.photo = photo;
        payload.caption = text;
      } else {
        payload.text = text;
      }

      if(btnText && btnUrl){
        payload.reply_markup = { inline_keyboard: [[{ text: btnText, url: btnUrl }]] };
      }

      const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/${endpoint}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if((await res.json()).ok) sent++;
    } catch(e){}
  }

  btn.disabled = false; btn.textContent = "Hammaga yuborish";
  document.getElementById('broadcastResult').innerHTML = `<b style="color:var(--green)">✅ ${sent} ta mijozga yuborildi.</b>`;
}
</script>
