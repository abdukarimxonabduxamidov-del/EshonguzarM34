<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Boshqaruv paneli — Eshonguzar M34</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2F4F1;
    --surface:#FFFFFF;
    --ink:#1C2420;
    --ink-soft:#4B564F;
    --teal:#1F4B49;
    --teal-light:#2F6B66;
    --teal-wash:#E4ECEA;
    --amber:#D9A441;
    --amber-dark:#B9832B;
    --amber-wash:#FBF0DA;
    --sage:#90A99E;
    --sage-wash:#EAF0ED;
    --brick:#B14B3A;
    --brick-wash:#F7E7E4;
    --line:#DDE4DF;
    --radius-card:14px;
    --radius-pill:999px;
    --shadow-card: 0 1px 2px rgba(28,36,32,0.06), 0 1px 1px rgba(28,36,32,0.04);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Work Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,.display{font-family:'Roboto Slab',serif; font-weight:600; margin:0;}
  .app{max-width:720px; margin:0 auto; min-height:100vh; background:var(--bg);}

  .topbar{
    position:sticky; top:0; z-index:10;
    background:var(--teal); color:#fff;
    padding:16px 18px 14px;
  }
  .topbar .eyebrow{font-size:11.5px; color:#B9D3CD; letter-spacing:0.02em;}
  .topbar h1{font-size:19px; color:#fff; margin-top:2px;}
  .refresh-btn{
    position:absolute; top:16px; right:16px;
    background:rgba(255,255,255,0.14); border:none; color:#fff;
    width:34px; height:34px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
  }
  .refresh-btn.spinning svg{animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  main{padding:14px 16px 40px;}

  .search-wrap{position:relative; margin-bottom:12px;}
  .search-wrap input{
    width:100%; padding:11px 14px 11px 38px; border-radius:12px;
    border:1px solid var(--line); background:var(--surface);
    font-family:inherit; font-size:13.5px; color:var(--ink);
  }
  .search-wrap svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--ink-soft);}

  .tab-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px; scrollbar-width:none;}
  .tab-row::-webkit-scrollbar{display:none;}
  .tab-chip{
    flex-shrink:0; padding:8px 14px; border-radius:999px;
    border:1px solid var(--line); background:var(--surface);
    font-size:12.5px; font-weight:600; color:var(--ink-soft);
    display:flex; align-items:center; gap:6px;
  }
  .tab-chip .count{
    background:var(--bg); border-radius:999px; padding:1px 6px; font-size:10.5px; font-weight:700;
  }
  .tab-chip.active{background:var(--teal); border-color:var(--teal); color:#fff;}
  .tab-chip.active .count{background:rgba(255,255,255,0.2); color:#fff;}

  .order-card{
    background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius-card); box-shadow:var(--shadow-card);
    padding:14px; margin-bottom:10px;
  }
  .order-top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:8px;}
  .order-name{font-weight:700; font-size:14.5px;}
  .order-date{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .status-pill{
    flex-shrink:0; font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px;
  }
  .status-Yangi{background:var(--amber-wash); color:var(--amber-dark);}
  .status-Jarayonda{background:var(--teal-wash); color:var(--teal-light);}
  .status-Tayyor{background:var(--sage-wash); color:#4B7062;}
  .status-Yolda{background:var(--teal); color:#fff;}
  .status-Bekor{background:var(--brick-wash); color:var(--brick);}

  .order-items{font-size:12.5px; color:var(--ink-soft); line-height:1.5; margin-bottom:10px;}
  .order-meta{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
  .meta-badge{
    font-size:11px; font-weight:600; color:var(--ink-soft);
    background:var(--bg); border-radius:8px; padding:4px 9px;
    display:flex; align-items:center; gap:4px;
  }
  .meta-badge svg{width:12px; height:12px;}

  .order-bottom{display:flex; align-items:center; justify-content:space-between; gap:10px; padding-top:10px; border-top:1px dashed var(--line);}
  .order-total{font-family:'Roboto Slab',serif; font-weight:600; font-size:15.5px; color:var(--teal);}
  .order-actions{display:flex; gap:6px; align-items:center;}
  .call-btn{
    width:32px; height:32px; border-radius:9px; border:1px solid var(--line);
    background:var(--surface); color:var(--teal); display:flex; align-items:center; justify-content:center;
  }
  .call-btn svg{width:15px; height:15px;}
  .status-select{
    font-family:inherit; font-size:12px; font-weight:600; color:var(--ink);
    border:1px solid var(--line); border-radius:9px; padding:7px 9px; background:var(--surface);
  }

  .empty-note{text-align:center; padding:50px 20px; color:var(--ink-soft); font-size:13px;}
  .empty-note svg{width:40px; height:40px; color:var(--line); margin-bottom:10px;}

  .toast{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; font-size:12.5px; font-weight:600;
    padding:10px 18px; border-radius:999px; opacity:0; pointer-events:none;
    transition:opacity .2s, transform .2s; z-index:50;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="eyebrow">Eshonguzar M34</div>
    <h1>Buyurtmalar boshqaruvi</h1>
    <button class="refresh-btn" id="refreshBtn" onclick="loadOrders()" aria-label="Yangilash">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"></path><path d="M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
    </button>
  </header>

  <main>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.35-4.35"></path></svg>
      <input type="text" id="searchInput" placeholder="Mijoz ismi yoki telefon bo'yicha qidirish..." oninput="renderOrders()">
    </div>
    <div class="tab-row" id="tabRow"></div>
    <div id="ordersList"></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDtAyKoU9Y1rhQcWkGeaXzDYnd6s2irLG4",
  authDomain: "eshonguzarm34-ee120.firebaseapp.com",
  databaseURL: "https://eshonguzarm34-ee120-default-rtdb.firebaseio.com",
  projectId: "eshonguzarm34-ee120",
  storageBucket: "eshonguzarm34-ee120.firebasestorage.app",
  messagingSenderId: "777474833190",
  appId: "1:777474833190:web:6ec125d84f6d82a8a21fe7"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const STATUSES = ["Yangi","Jarayonda","Tayyor","Yo'lda","Bekor qilindi"];
let orders = [];
let activeTab = 'Barchasi';

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function statusClass(status){
  if(status==="Yo'lda") return 'status-Yolda';
  if(status==="Bekor qilindi") return 'status-Bekor';
  if(STATUSES.includes(status)) return 'status-' + status.replace(/'/g,'');
  return 'status-Yangi';
}

function formatDate(d){
  try{
    const date = new Date(d);
    return date.toLocaleDateString('uz-UZ', {day:'2-digit', month:'2-digit', year:'numeric'}) + ' ' +
           date.toLocaleTimeString('uz-UZ', {hour:'2-digit', minute:'2-digit'});
  }catch(e){ return d; }
}
function formatSom(n){
  const num = Number(n) || 0;
  return num.toLocaleString('en-US').replace(/,/g,' ') + " so'm";
}

function loadOrders(){
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  db.ref('orders').on('value', (snapshot) => {
    const data = snapshot.val() || {};
    orders = Object.keys(data).map(key => ({ key, ...data[key] }));
    orders.reverse(); // newest first
    btn.classList.remove('spinning');
    renderTabs();
    renderOrders();
  }, () => {
    btn.classList.remove('spinning');
    showToast("Yuklab bo'lmadi, qayta urinib ko'ring");
  });
}

function renderTabs(){
  const tabs = ['Barchasi', ...STATUSES];
  const wrap = document.getElementById('tabRow');
  wrap.innerHTML = tabs.map(t=>{
    const count = t==='Barchasi' ? orders.length : orders.filter(o=>o.status===t).length;
    return `<button class="tab-chip ${activeTab===t?'active':''}" onclick="setTab('${t}')">${t}<span class="count">${count}</span></button>`;
  }).join('');
}
function setTab(t){
  activeTab = t;
  renderTabs();
  renderOrders();
}

function renderOrders(){
  const query = (document.getElementById('searchInput').value || '').toLowerCase().trim();
  let list = orders.filter(o=>{
    const matchTab = activeTab==='Barchasi' || o.status===activeTab;
    const matchQuery = !query || (o.name||'').toLowerCase().includes(query) || (o.phone||'').includes(query);
    return matchTab && matchQuery;
  });

  const wrap = document.getElementById('ordersList');
  if(list.length===0){
    wrap.innerHTML = `
      <div class="empty-note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
        <p>Bu bo'limda buyurtma yo'q.</p>
      </div>`;
    return;
  }

  wrap.innerHTML = list.map(o=>`
    <div class="order-card">
      <div class="order-top">
        <div>
          <div class="order-name">${o.name || "Noma'lum"}</div>
          <div class="order-date">${formatDate(o.date)}</div>
        </div>
        <span class="status-pill ${statusClass(o.status)}">${o.status}</span>
      </div>
      <div class="order-items">${o.items || ''}</div>
      <div class="order-meta">
        <span class="meta-badge">💳 ${o.payment || '—'}</span>
        <span class="meta-badge">🚚 ${o.delivery || '—'}</span>
        ${o.address ? `<span class="meta-badge">📍 ${o.address}</span>` : ''}
      </div>
      <div class="order-bottom">
        <span class="order-total">${formatSom(o.total)}</span>
        <div class="order-actions">
          <a class="call-btn" href="tel:${o.phone}" aria-label="Qo'ng'iroq qilish">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
          </a>
          <select class="status-select" onchange="changeStatus('${o.key}', this.value)">
            ${STATUSES.map(s=>`<option value="${s}" ${s===o.status?'selected':''}>${s}</option>`).join('')}
          </select>
        </div>
      </div>
    </div>
  `).join('');
}

function changeStatus(key, status){
  const order = orders.find(o=>o.key===key);
  const prevStatus = order ? order.status : null;
  if(order) order.status = status; // optimistic update
  renderTabs();

  db.ref('orders/' + key + '/status').set(status)
    .then(()=>{ showToast("Holat yangilandi: " + status); })
    .catch(()=>{
      if(order) order.status = prevStatus; // revert on failure
      renderTabs();
      renderOrders();
      showToast("Yangilab bo'lmadi, qayta urinib ko'ring");
    });
}

loadOrders();
</script>
</body>
</html>
